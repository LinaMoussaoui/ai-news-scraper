version: '3.8'

# Development override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    # Override command to run with hot reload
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    # Increase logging for development
    environment:
      LOG_LEVEL: DEBUG
    # Mount backend directory for hot reload
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    # Don't restart on failures in dev (helps debugging)
    restart: on-failure:3
